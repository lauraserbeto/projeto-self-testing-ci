name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Lint, testes e limites de cobertura
        run: python scripts/verify.py
      - name: Guardar logs e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

  load:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Executar 50 usuários concorrentes
        run: python scripts/run_load.py
      - name: Guardar métricas de carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-${{ github.run_id }}
          path: artifacts/load*
          retention-days: 14
